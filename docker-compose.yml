# Sample docker-compose for standalone agent-wechat deployment.
# Generate a token before starting:
#   mkdir -p ~/.config/agent-wechat
#   openssl rand -hex 32 > ~/.config/agent-wechat/token
#   chmod 600 ~/.config/agent-wechat/token

services:
  agent-wechat:
    image: ghcr.io/thisnick/agent-wechat:latest
    container_name: agent-wechat
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
      - NET_ADMIN
    ports:
      - "6174:6174"
    volumes:
      - agent-wechat-data:/data
      - agent-wechat-home:/home/wechat
      - ~/.config/agent-wechat/token:/data/auth-token:ro
    environment:
      - PROXY=${PROXY:-}
      # Outbound send safety defaults. Jitter smooths bursts only.
      - AGENT_WECHAT_OUTBOUND_QUEUE_CAPACITY=${AGENT_WECHAT_OUTBOUND_QUEUE_CAPACITY:-20}
      - AGENT_WECHAT_OUTBOUND_MIN_SPACING_MS=${AGENT_WECHAT_OUTBOUND_MIN_SPACING_MS:-1500}
      - AGENT_WECHAT_OUTBOUND_JITTER_MS=${AGENT_WECHAT_OUTBOUND_JITTER_MS:-250}
      - AGENT_WECHAT_OUTBOUND_TASK_TTL_MS=${AGENT_WECHAT_OUTBOUND_TASK_TTL_MS:-60000}
      - AGENT_WECHAT_OUTBOUND_IDEMPOTENCY_TTL_MS=${AGENT_WECHAT_OUTBOUND_IDEMPOTENCY_TTL_MS:-600000}
      - AGENT_WECHAT_OUTBOUND_DISABLED=${AGENT_WECHAT_OUTBOUND_DISABLED:-false}
      - AGENT_WECHAT_MACHINE_ID=${AGENT_WECHAT_MACHINE_ID:-}
      - AGENT_WECHAT_SPOOF_OS=${AGENT_WECHAT_SPOOF_OS:-1}
      - TZ=${TZ:-Asia/Shanghai}
    restart: unless-stopped

volumes:
  agent-wechat-data:
  agent-wechat-home:
