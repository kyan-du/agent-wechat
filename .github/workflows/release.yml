name: Prerelease Validation Only

# P1-B1 is evidence generation only. This workflow has no publication
# credentials, write permission, tag trigger, publish step, registry push, or
# GitHub Release operation. A later owner/legal-approved PR must add those.
on:
  pull_request:
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'release/**'
      - 'scripts/audit-release.sh'
      - 'scripts/release-audit.mjs'
      - 'scripts/validate-docker-context.mjs'
      - 'scripts/validate-prerelease-contract.mjs'
      - 'scripts/validate-prerelease.sh'
      - 'scripts/test-prerelease-contract.sh'
      - 'scripts/test-prerelease-manifest.sh'
      - 'scripts/smoke-npm-packages.mjs'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'release/**'
      - 'scripts/audit-release.sh'
      - 'scripts/release-audit.mjs'
      - 'scripts/validate-docker-context.mjs'
      - 'scripts/validate-prerelease-contract.mjs'
      - 'scripts/validate-prerelease.sh'
      - 'scripts/test-prerelease-contract.sh'
      - 'scripts/test-prerelease-manifest.sh'
      - 'scripts/smoke-npm-packages.mjs'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove validation-only contract
        run: ./scripts/test-prerelease-contract.sh

      - name: Prove canonical prerelease manifest
        run: pnpm test:prerelease-manifest

      - name: Validate clean release inputs and real pack reports
        env:
          CI: true
        run: ./scripts/validate-prerelease.sh

      - name: Clean-install and import packed public packages
        run: pnpm test:npm-packages
