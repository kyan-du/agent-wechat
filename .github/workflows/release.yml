name: Release

# Downstream safety: release publishing remains disabled until package names,
# trusted publishing, and a protected release environment are configured.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Audit release artifacts
        run: |
          ./scripts/audit-release.sh
          git diff --exit-code -- docs/release-audit/npm-materials.json
          unexpected=$(git status --porcelain --untracked-files=all | grep -Ev '^(\?\?| M) (packages/.*/dist/|docs/dist/)' || true)
          test -z "$unexpected" || { printf '%s\n' "$unexpected"; exit 1; }
