name: Docker Build Validation

# P1-A fail-closed boundary: pull-request runs only validate local image builds.
# Post-merge commit verification publication is isolated in docker-commit-verification.yml;
# formal semver publication remains behind the manually authorized release workflow.
on:
  pull_request:
    paths:
      - 'docker/**'
      - 'packages/agent-server-rust/**'
      - 'scripts/validate-release-boundary.mjs'
      - 'docker/release-inputs.json'
      - 'docker/release-instruction-allowlist.json'
      - 'docker/release-materials/requirements.lock'
      - 'docker/release-materials/frida_tools-14.10.4-py3-none-any.whl'
      - 'scripts/validate-release-inputs.mjs'
      - 'scripts/test-release-inputs.mjs'
      - 'scripts/download-wechat.sh'
      - '.github/workflows/docker-rebuild.yml'
      - '.github/workflows/docker-build-ref.yml'
      - 'scripts/validate-ref-image-workflow.mjs'
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'packages/agent-server-rust/**'
      - 'scripts/validate-release-boundary.mjs'
      - 'docker/release-inputs.json'
      - 'docker/release-instruction-allowlist.json'
      - 'docker/release-materials/requirements.lock'
      - 'docker/release-materials/frida_tools-14.10.4-py3-none-any.whl'
      - 'scripts/validate-release-inputs.mjs'
      - 'scripts/test-release-inputs.mjs'
      - 'scripts/download-wechat.sh'
      - '.github/workflows/docker-rebuild.yml'
      - '.github/workflows/docker-build-ref.yml'
      - 'scripts/validate-ref-image-workflow.mjs'

permissions:
  contents: read

# Keep the architecture jobs for only the newest commit of each PR. Main runs
# are intentionally isolated so a later push cannot cancel an earlier gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Publication boundary guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node scripts/validate-release-boundary.mjs
      - run: node scripts/validate-release-inputs.mjs && node scripts/test-release-inputs.mjs

  build:
    name: Build only (${{ matrix.arch }})
    needs: guard
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare Docker context
        run: |
          rm -rf docker/agent-server-rust
          mkdir -p docker/agent-server-rust
          cp packages/agent-server-rust/Cargo.toml docker/agent-server-rust/
          [ -f packages/agent-server-rust/Cargo.lock ] && cp packages/agent-server-rust/Cargo.lock docker/agent-server-rust/
          cp -r packages/agent-server-rust/src docker/agent-server-rust/
          cp -r packages/agent-server-rust/migrations docker/agent-server-rust/

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Validate image build without loading or publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
