name: Docker Build Validation

# P1-A fail-closed boundary: this workflow only validates local image builds.
# Publication, manifests, release tags, and the floating tag remain disabled until the
# documented P1-B/P1-C release gates are explicitly completed.
on:
  pull_request:
    paths:
      - 'docker/**'
      - 'packages/agent-server-rust/**'
      - 'scripts/validate-release-boundary.mjs'
      - 'docker/release-inputs.json'
      - 'docker/release-materials/requirements.lock'
      - 'scripts/validate-release-inputs.mjs'
      - 'scripts/test-release-inputs.mjs'
      - '.github/workflows/docker-rebuild.yml'
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'packages/agent-server-rust/**'
      - 'scripts/validate-release-boundary.mjs'
      - 'docker/release-inputs.json'
      - 'docker/release-materials/requirements.lock'
      - 'scripts/validate-release-inputs.mjs'
      - 'scripts/test-release-inputs.mjs'
      - '.github/workflows/docker-rebuild.yml'

permissions:
  contents: read

jobs:
  guard:
    name: Publication boundary guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/validate-release-boundary.mjs
      - run: node scripts/validate-release-inputs.mjs && node scripts/test-release-inputs.mjs

  build:
    name: Build only (${{ matrix.arch }})
    needs: guard
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Docker context
        run: |
          rm -rf docker/agent-server-rust
          mkdir -p docker/agent-server-rust
          cp packages/agent-server-rust/Cargo.toml docker/agent-server-rust/
          [ -f packages/agent-server-rust/Cargo.lock ] && cp packages/agent-server-rust/Cargo.lock docker/agent-server-rust/
          cp -r packages/agent-server-rust/src docker/agent-server-rust/
          cp -r packages/agent-server-rust/migrations docker/agent-server-rust/

      - uses: docker/setup-buildx-action@v4

      - name: Validate image build without loading or publishing
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
