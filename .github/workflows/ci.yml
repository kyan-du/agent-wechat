name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      entrypoint: ${{ steps.filter.outputs.entrypoint }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ts:
              - 'packages/cli/**'
              - 'packages/shared/**'
              - 'packages/openclaw-extension/**'
              - 'packages/wechaty-gateway/**'
              - 'packages/wechaty-puppet/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'MAINTENANCE.md'
              - 'SECURITY.md'
              - '.github/dependabot.yml'
              - 'src/**'
              - 'scripts/validate-release-boundary.mjs'
              - '.github/workflows/docker-rebuild.yml'
              - '.github/workflows/ci.yml'
              - 'scripts/audit-release.sh'
              - 'scripts/release-audit.mjs'
              - 'scripts/validate-docker-context.mjs'
              - 'scripts/test-release-audit.sh'
              - 'scripts/validate-prerelease-contract.mjs'
              - 'scripts/generate-prerelease-manifest.mjs'
              - 'scripts/validate-prerelease.sh'
              - 'scripts/test-prerelease-contract.sh'
              - 'scripts/test-prerelease-manifest.sh'
              - 'scripts/test-packed-cli.sh'
              - 'scripts/test-packed-cli-health.mjs'
              - 'release/**'
              - 'docs/release/**'
              - '.github/workflows/release.yml'
              - 'docs/release-audit/**'
              - 'docker/**'
            rust:
              - 'packages/agent-server-rust/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            entrypoint:
              - 'docker/entrypoint.sh'
              - 'docker/identity.sh'
              - 'docker/supervise-agent-server.sh'
              - 'scripts/test-entrypoint-identity.sh'
              - 'scripts/test-entrypoint-supervise.sh'
              - 'scripts/test-entrypoint-owned-pid1.sh'
              - 'scripts/test-auth-reset-identity.sh'
              - '.github/workflows/ci.yml'

  entrypoint:
    needs: changes
    if: needs.changes.outputs.entrypoint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Entrypoint identity fail-closed
        run: bash scripts/test-entrypoint-identity.sh
      - name: Entrypoint supervise lifecycle
        run: bash scripts/test-entrypoint-supervise.sh
      - name: Ownership guard as PID 1
        run: bash scripts/test-entrypoint-owned-pid1.sh
      - name: Auth reset identity scope
        run: bash scripts/test-auth-reset-identity.sh

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Release artifact audit
        run: |
          node scripts/release-audit.mjs --write
          git diff --exit-code -- docs/release-audit/npm-materials.json
          ./scripts/test-release-audit.sh
          unexpected=$(git status --porcelain --untracked-files=all | grep -Ev '^(\?\?| M) (packages/.*/dist/|docs/dist/)' || true)
          test -z "$unexpected" || { printf '%s\n' "$unexpected"; exit 1; }

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (all packages)
        run: pnpm -r --if-present test

      - name: Packed CLI clean-consumer journeys
        run: ./scripts/test-packed-cli.sh

      - name: Validate prerelease contract without publication
        run: pnpm test:prerelease-contract

      - name: Guard unreleased channels and root CLI image behavior
        run: |
          pnpm test:release-boundary -- --require-rendered
          pnpm test:root-cli-image

      - name: Lint availability
        run: |
          if pnpm run | grep -Eq '^  lint'; then
            pnpm lint
          else
            echo 'No repository-level lint script is defined; not substituting another check.'
          fi

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --manifest-path packages/agent-server-rust/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path packages/agent-server-rust/Cargo.toml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @kyan-du/agent-wechat-docs

      - name: Build docs
        run: pnpm --filter @kyan-du/agent-wechat-docs build
