name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded commits on the same PR do not need to finish. Main pushes use the
# run id so separate commits are never cancelled by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      entrypoint: ${{ steps.filter.outputs.entrypoint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            ts:
              - 'packages/cli/**'
              - 'packages/shared/**'
              - 'packages/openclaw-extension/**'
              - 'packages/wechaty-gateway/**'
              - 'packages/wechaty-puppet/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'MAINTENANCE.md'
              - 'SECURITY.md'
              - '.github/dependabot.yml'
              - 'src/**'
              - 'scripts/validate-release-boundary.mjs'
              - 'scripts/validate-ghcr-release.mjs'
              - 'scripts/test-ghcr-release.mjs'
              - '.github/workflows/ghcr-prerelease.yml'
              - '.github/workflows/docker-rebuild.yml'
              - '.github/workflows/ci.yml'
              - 'scripts/validate-docker-context.mjs'
              - 'scripts/validate-prerelease-contract.mjs'
              - 'scripts/generate-prerelease-manifest.mjs'
              - 'scripts/validate-prerelease.sh'
              - 'scripts/test-prerelease-contract.sh'
              - 'scripts/test-prerelease-manifest.sh'
              - 'scripts/check-npm-production-release.mjs'
              - 'scripts/npm-release-utils.mjs'
              - 'scripts/npm-release-utils.test.mjs'
              - 'scripts/verify-published-npm-release.mjs'
              - 'scripts/smoke-npm-packages.mjs'
              - 'scripts/test-packed-cli.sh'
              - 'scripts/test-packed-cli-health.mjs'
              - 'release/**'
              - 'docs/release/**'
              - '.github/workflows/release-validation.yml'
              - '.github/workflows/npm-*.yml'
              - 'docker/**'
            rust:
              - 'packages/agent-server-rust/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            entrypoint:
              - 'docker/entrypoint.sh'
              - 'docker/identity.sh'
              - 'docker/supervise-agent-server.sh'
              - 'scripts/test-entrypoint-identity.sh'
              - 'scripts/test-entrypoint-supervise.sh'
              - 'scripts/test-entrypoint-owned-pid1.sh'
              - 'scripts/test-auth-reset-identity.sh'
              - '.github/workflows/ci.yml'

  entrypoint:
    needs: changes
    if: needs.changes.outputs.entrypoint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Entrypoint identity fail-closed
        run: bash scripts/test-entrypoint-identity.sh
      - name: Entrypoint supervise lifecycle
        run: bash scripts/test-entrypoint-supervise.sh
      - name: Ownership guard as PID 1
        run: bash scripts/test-entrypoint-owned-pid1.sh
      - name: Auth reset identity scope
        run: bash scripts/test-auth-reset-identity.sh

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (all packages)
        run: pnpm -r --if-present test

      - name: Packed CLI clean-consumer journeys
        run: ./scripts/test-packed-cli.sh

      - name: Validate prerelease contract without publication
        run: |
          pnpm test:prerelease-contract
          pnpm test:npm-production-release

      - name: Guard unreleased channels and root CLI image behavior
        run: |
          pnpm test:release-boundary -- --require-rendered
          pnpm test:ghcr-release
          pnpm test:root-cli-image

      - name: Lint availability
        run: |
          if pnpm run | grep -Eq '^  lint'; then
            pnpm lint
          else
            echo 'No repository-level lint script is defined; not substituting another check.'
          fi

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/agent-server-rust -> target

      - name: Cargo check
        run: cargo check --manifest-path packages/agent-server-rust/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path packages/agent-server-rust/Cargo.toml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @kyan-du/agent-wechat-docs

      - name: Build docs
        run: pnpm --filter @kyan-du/agent-wechat-docs build
