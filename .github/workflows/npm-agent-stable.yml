name: Retired duplicate npm workflow guard

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Guard validation only
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: none

jobs:
  retired:
    name: Prove the second publisher is retired
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fail closed
        run: |
          test '${{ inputs.dry_run }}' = true
          node -e 'const c=require("./release/agent-release-contract.json");if(c.deploymentEnabled!==false||c.publisherWorkflow!==".github/workflows/npm-agent-release.yml"||c.environment!=="npm-production")throw Error("production publisher identity drift")'
          echo 'The duplicate release workflow is retired; only the exact production workflow may publish.'
