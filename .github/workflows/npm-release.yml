name: npm production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version to publish, for example 0.12.0
        required: true
        type: string

concurrency:
  group: npm-production-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: none

jobs:
  verify:
    name: Verify production package candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Confirm dispatch SHA is current main with passing CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          main_sha=$(git rev-parse origin/main)
          test "$(git rev-parse HEAD)" = "$main_sha"
          test "$GITHUB_SHA" = "$main_sha"
          successes=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --branch main \
            --commit "$GITHUB_SHA" \
            --status completed \
            --limit 20 \
            --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length')
          test "$successes" -gt 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate exact release version and package metadata
        run: node scripts/check-npm-production-release.mjs "${{ inputs.version }}"

      - name: Test and build
        env:
          CI: true
        run: |
          pnpm typecheck
          pnpm turbo run build --filter='!@kyan-du/agent-wechat-docs'
          pnpm -r --if-present test
          pnpm test:release-boundary

      - name: Validate package, Cargo, and CLI runtime versions
        run: node scripts/validate-release-consistency.mjs --version "${{ inputs.version }}" --commit "$GITHUB_SHA"

      - name: Pack exact production tarballs
        run: |
          set -euo pipefail
          rm -rf .release-pack
          mkdir -p .release-pack
          npm pack ./packages/cli --json --ignore-scripts --pack-destination .release-pack
          npm pack ./packages/openclaw-extension --json --ignore-scripts --pack-destination .release-pack
          npm pack ./packages/wechaty-puppet --json --ignore-scripts --pack-destination .release-pack
          shasum -a 256 .release-pack/*.tgz > .release-pack/SHA256SUMS
          node scripts/check-npm-production-release.mjs "${{ inputs.version }}" --tarballs .release-pack

      - name: Clean-install and import packed tarballs
        run: pnpm test:npm-packages

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-production-${{ inputs.version }}-${{ github.sha }}
          path: .release-pack
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  publish:
    name: Publish to npm production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-production-${{ inputs.version }}-${{ github.sha }}
          path: .release-pack

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Confirm exact main and packed tarballs
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          main_sha=$(git rev-parse origin/main)
          test "$(git rev-parse HEAD)" = "$main_sha"
          test "$GITHUB_SHA" = "$main_sha"
          shasum -a 256 --check .release-pack/SHA256SUMS
          node scripts/check-npm-production-release.mjs "${{ inputs.version }}" --tarballs .release-pack

      - name: Publish or verify existing public npm packages
        run: node scripts/npm-release-utils.mjs publish-existing-safe "${{ inputs.version }}" .release-pack

      - name: Verify public registry versions and clean install
        run: node scripts/verify-published-npm-release.mjs "${{ inputs.version }}"

      - name: Create exact tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing=""
          if existing_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            existing="$existing_ref"
          fi
          if [ -n "$existing" ]; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --jq .ref
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            release_tag=$(gh release view "$tag" --json tagName --jq .tagName)
            test "$release_tag" = "$tag"
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes "Release $tag"
          fi

  publish-ghcr:
    name: Publish stable GHCR image
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    env:
      IMAGE: ghcr.io/kyan-du/agent-wechat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm exact release commit and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          VERSION="$VERSION" node -e 'const fs=require("fs");const v=process.env.VERSION;if(!/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$/.test(v))throw Error(`stable version required: ${v}`);for(const p of ["packages/cli/package.json","packages/openclaw-extension/package.json","packages/wechaty-puppet/package.json"])if(JSON.parse(fs.readFileSync(p)).version!==v)throw Error(`${p} version mismatch`);const cargo=fs.readFileSync("packages/agent-server-rust/Cargo.toml","utf8").match(/^version\\s*=\\s*"([^"]+)"/m)?.[1];if(cargo!==v)throw Error(`Cargo version ${cargo} != ${v}`);console.log(`release source versions match ${v}`);'

      - name: Prepare Docker context
        run: |
          set -euo pipefail
          rm -rf docker/agent-server-rust
          mkdir -p docker/agent-server-rust
          cp packages/agent-server-rust/Cargo.toml docker/agent-server-rust/
          [ -f packages/agent-server-rust/Cargo.lock ] && cp packages/agent-server-rust/Cargo.lock docker/agent-server-rust/
          cp -r packages/agent-server-rust/src packages/agent-server-rust/migrations docker/agent-server-rust/

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - id: build
        name: Push stable image by digest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker
          build-args: |
            VERSION=${{ inputs.version }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=stable-release-${{ matrix.arch }}
          cache-to: type=gha,scope=stable-release-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          test "${digest#sha256:}" != "$digest"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-ghcr-manifest:
    name: Publish exact stable GHCR tag
    needs: [publish, publish-ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kyan-du/agent-wechat
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stable-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Create and verify exact stable tag
        run: |
          set -euo pipefail
          mapfile -t files < <(find /tmp/digests -type f | sort)
          test "${#files[@]}" -eq 2
          refs=()
          for file in "${files[@]}"; do refs+=("$IMAGE@sha256:$(basename "$file")"); done
          existing_status=0
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > existing.json 2>existing.err || existing_status=$?
          if [ "$existing_status" -eq 0 ]; then
            EXPECTED_DIGESTS="$(printf '%s\n' "${files[@]}" | xargs -n1 basename | sort | paste -sd, -)" \
              node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("existing.json"));const expected=new Set(process.env.EXPECTED_DIGESTS.split(","));const ms=j.manifests??j.manifest?.manifests??[];const actual=new Set(ms.filter(x=>x.platform?.os!=="unknown"&&x.digest).map(x=>x.digest.replace("sha256:","")));if(actual.size!==2||actual.size!==expected.size||[...actual].some(x=>!expected.has(x)))throw Error(`existing stable tag $IMAGE:$VERSION is bound to a different manifest`);console.log(`stable tag already matches exact manifest: $IMAGE:$VERSION`)'
            exit 0
          fi
          if ! grep -Eqi 'manifest unknown|no such manifest|not found' existing.err; then
            cat existing.err >&2
            exit "$existing_status"
          fi
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .}}' > manifest.json
          VERSION="$VERSION" node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("manifest.json"));const ms=j.manifest?.manifests??j.manifests??[];const images=ms.filter(x=>x.platform?.os!=="unknown");const ps=images.map(x=>`${x.platform?.os}/${x.platform?.architecture}`).sort();if(JSON.stringify(ps)!==JSON.stringify(["linux/amd64","linux/arm64"]))throw Error(`image platforms: ${ps}`);if(images.length!==2)throw Error("stable tag must contain exactly two image manifests");'
          echo "Published stable image $IMAGE:$VERSION"
