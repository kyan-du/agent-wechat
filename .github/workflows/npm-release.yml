name: Agent-operated npm production release (inactive)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact formal X.Y.Z version
        required: true
        type: string
      release_sha:
        description: Full immutable release commit SHA on main
        required: true
        type: string
      manifest_sha256:
        description: Lowercase sha256 digest of the reviewed release manifest
        required: true
        type: string
      authorization_id:
        description: Opaque one-time authorization identity
        required: true
        type: string
      operation:
        description: Fresh release or explicit partial-publication reconciliation
        required: true
        type: choice
        options: [release, reconcile]
      reconciliation_sha256:
        description: Required exact PARTIAL_PUBLICATION receipt digest for reconcile
        required: false
        type: string
      dry_run:
        description: Validation only; deployment activation is not part of this PR
        required: true
        default: true
        type: boolean

concurrency:
  group: npm-production-${{ inputs.version }}-${{ inputs.manifest_sha256 }}-${{ inputs.authorization_id }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: none

jobs:
  validate:
    name: Validate explicit immutable production intent
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      artifact_name: ${{ steps.intent.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: npm install --global npm@11.5.1
      - id: intent
        name: Reject mutable, prerelease, or activated input
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          OPERATION: ${{ inputs.operation }}
          RECONCILIATION_SHA256: ${{ inputs.reconciliation_sha256 }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          test "$DRY_RUN" = true
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$MANIFEST_SHA256" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s' "$AUTHORIZATION_ID" | grep -Eq '^[0-9a-f]{32}$'
          if [ "$OPERATION" = reconcile ]; then
            printf '%s' "$RECONCILIATION_SHA256" | grep -Eq '^sha256:[0-9a-f]{64}$'
          else
            test "$OPERATION" = release
            test -z "$RECONCILIATION_SHA256"
          fi
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          node -e 'const c=require("./release/agent-release-contract.json");if(c.deploymentEnabled!==false||c.environment!=="npm-production"||c.distTag!=="latest")throw Error("unexpected activation state")'
          artifact_name="npm-production-${VERSION}-${RELEASE_SHA}-${MANIFEST_SHA256#sha256:}"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Install, test, build, and prove inactive contracts
        env:
          CI: true
        run: |
          pnpm install --frozen-lockfile
          pnpm test:prerelease-contract
          pnpm test:release-plan
          pnpm test:release-workflows
          pnpm typecheck
          pnpm -r --if-present test
          pnpm turbo run build --filter='!@kyan-du/agent-wechat-docs'
          node scripts/test-npm-release-authorization.mjs
          node scripts/validate-release-boundary.mjs

  candidate:
    name: Seal deterministic production candidate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate twice and compare the complete candidate byte-for-byte
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .release-candidate/first .release-candidate/second
          node scripts/prepare-agent-release.mjs --output .release-candidate/first/agent-release-manifest.json --artifacts .release-candidate/first/tarballs
          node scripts/prepare-agent-release.mjs --output .release-candidate/second/agent-release-manifest.json --artifacts .release-candidate/second/tarballs
          cmp .release-candidate/first/agent-release-manifest.json .release-candidate/second/agent-release-manifest.json
          diff -qr .release-candidate/first/tarballs .release-candidate/second/tarballs
          node scripts/verify-agent-release.mjs --manifest .release-candidate/first/agent-release-manifest.json --artifacts .release-candidate/first/tarballs --version "$VERSION" --commit "$RELEASE_SHA" --manifest-sha256 "$MANIFEST_SHA256"
          rm -rf .release-candidate/second
          mv .release-candidate/first/agent-release-manifest.json .release-candidate/
          mv .release-candidate/first/tarballs .release-candidate/
          rmdir .release-candidate/first
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: |
            .release-candidate/agent-release-manifest.json
            .release-candidate/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Bind artifact producer identity
        run: |
          test -n '${{ steps.upload.outputs.artifact-id }}'
          echo 'artifact-id=${{ steps.upload.outputs.artifact-id }} digest=${{ steps.upload.outputs.artifact-digest }} run=${{ github.run_id }} attempt=${{ github.run_attempt }}'

  deploy:
    name: Unreachable production deployment blueprint
    needs: [validate, candidate]
    if: ${{ false }} # Activation requires a separate exact-head reviewed PR.
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: .release-candidate
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Bind downloaded artifact to producer digest
        run: |
          test -n '${{ needs.candidate.outputs.artifact_id }}'
          test -n '${{ needs.candidate.outputs.artifact_digest }}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - name: Re-hash sealed production candidate without rebuilding
        run: node scripts/verify-agent-release.mjs --manifest .release-candidate/agent-release-manifest.json --artifacts .release-candidate/tarballs --version "${{ inputs.version }}" --commit "${{ inputs.release_sha }}" --manifest-sha256 "${{ inputs.manifest_sha256 }}"
      - name: Fetch and authenticate authorization before replay lookup
        env:
          RELEASE_AUTHORIZATION_NONCE: ${{ secrets.RELEASE_AUTHORIZATION_NONCE }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_RECONCILIATION_SHA256: ${{ inputs.reconciliation_sha256 }}
          VERSION: ${{ inputs.version }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          NPM_AUTHORIZATION_SHA: ${{ vars.NPM_AUTHORIZATION_SHA }}
          NPM_AUTHORIZATION_TAG_OID: ${{ vars.NPM_AUTHORIZATION_TAG_OID }}
        run: |
          printf '%s' "$NPM_AUTHORIZATION_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$NPM_AUTHORIZATION_TAG_OID" | grep -Eq '^[0-9a-f]{40}$'
          authorization_ref="refs/tags/npm-release-auth/v$VERSION/$AUTHORIZATION_ID"
          git fetch origin "$authorization_ref:$authorization_ref" --no-tags
          node scripts/verify-npm-release-authorization.mjs .release-candidate/agent-release-manifest.json "${{ inputs.release_sha }}" "$authorization_ref" "$NPM_AUTHORIZATION_SHA" "$NPM_AUTHORIZATION_TAG_OID" "$AUTHORIZATION_ID" --skip-consumption-lookup
      - name: Authenticate operation against exact registry state before writes
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          RECONCILIATION_SHA256: ${{ inputs.reconciliation_sha256 }}
        run: |
          set -euo pipefail
          node scripts/reconcile-npm-release.mjs --manifest .release-candidate/agent-release-manifest.json --output reconciliation-before.json
          operation_args=(--operation "$RELEASE_OPERATION")
          if [ "$RELEASE_OPERATION" = reconcile ]; then operation_args+=(--reconciliation-sha256 "$RECONCILIATION_SHA256"); fi
          node scripts/verify-release-operation.mjs --manifest .release-candidate/agent-release-manifest.json --reconciliation reconciliation-before.json "${operation_args[@]}"
          node scripts/select-npm-release-artifacts.mjs --manifest .release-candidate/agent-release-manifest.json --reconciliation reconciliation-before.json "${operation_args[@]}" --output publish-list.txt
      - name: Atomically consume authorization and create annotated tag
        env:
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          consumption="npm-release-consumed/v$VERSION/$AUTHORIZATION_ID"
          node scripts/consume-release-authorization.mjs --atomic-cas-required --consumption "$consumption" --release-tag "v$VERSION" --target "$RELEASE_SHA"
      - name: Publish only missing sealed tarballs with provenance
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          while IFS= read -r tarball; do
            test -n "$tarball" || continue
            npm publish ".release-candidate/tarballs/$tarball" --tag "agent-stage-${{ inputs.version }}" --access public --provenance
          done < publish-list.txt
      - name: Verify package integrity and provenance before latest
        run: node scripts/reconcile-npm-release.mjs --manifest .release-candidate/agent-release-manifest.json --require-complete --output reconciliation-complete.json
      - name: Advance only incorrect latest mappings
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm dist-tag add "@kyan-du/agent-wechat-cli@$VERSION" latest
          npm dist-tag add "@kyan-du/agent-wechat-openclaw@$VERSION" latest
          npm dist-tag add "@kyan-du/agent-wechat-wechaty-puppet@$VERSION" latest
          node scripts/reconcile-npm-release.mjs --manifest .release-candidate/agent-release-manifest.json --require-complete --require-dist-tags --output reconciliation-final.json
      - name: Create or verify exact final GitHub Release after registry reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-github-release.mjs --manifest .release-candidate/agent-release-manifest.json
      - name: Clean-install exact public registry versions
        run: node scripts/smoke-published-npm-release.mjs --manifest .release-candidate/agent-release-manifest.json
