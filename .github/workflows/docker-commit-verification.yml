name: Publish Docker Commit Verification Image

# Commit verification images are disposable post-merge validation artifacts. They are
# separate from the manually authorized semver prerelease publication workflow.
on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'packages/agent-server-rust/**'
      - 'scripts/validate-release-inputs.mjs'
      - 'scripts/test-release-inputs.mjs'
      - 'scripts/download-wechat.sh'
      - '.github/workflows/docker-commit-verification.yml'
      - 'scripts/validate-commit-image-workflow.mjs'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-commit-verification-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kyan-du/agent-wechat

jobs:
  authorize:
    name: Authorize exact main commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        name: Bind image to pushed commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          tag="${GITHUB_SHA::7}"
          test "$tag" = "$(git rev-parse HEAD | cut -c1-7)"
          printf 'sha=%s\ntag=%s\n' "$GITHUB_SHA" "$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} digest
    needs: authorize
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Prepare Docker context
        run: |
          rm -rf docker/agent-server-rust
          mkdir -p docker/agent-server-rust
          cp packages/agent-server-rust/Cargo.toml docker/agent-server-rust/
          [ -f packages/agent-server-rust/Cargo.lock ] && cp packages/agent-server-rust/Cargo.lock docker/agent-server-rust/
          cp -r packages/agent-server-rust/src packages/agent-server-rust/migrations docker/agent-server-rust/
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - id: build
        name: Push exact commit content by digest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=commit-verification-${{ matrix.arch }}
          cache-to: type=gha,scope=commit-verification-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          test "${digest#sha256:}" != "$digest"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commit-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish exact commit tag
    needs: [authorize, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: commit-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Create and verify commit tag manifest
        env:
          TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find /tmp/digests -type f | sort)
          test "${#files[@]}" -eq 2
          refs=()
          for file in "${files[@]}"; do refs+=("$IMAGE@sha256:$(basename "$file")"); done
          docker buildx imagetools create --tag "$IMAGE:$TAG" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .}}' > manifest.json
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("manifest.json"));const ms=j.manifest?.manifests??j.manifests??[];const ps=ms.filter(x=>x.platform?.os!=="unknown").map(x=>`${x.platform?.os}/${x.platform?.architecture}`).sort();if(JSON.stringify(ps)!==JSON.stringify(["linux/amd64","linux/arm64"]))throw Error(`image platforms: ${ps}`)'
          echo "Published commit verification image $IMAGE:$TAG"
