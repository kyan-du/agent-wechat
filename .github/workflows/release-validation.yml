name: Release Validation

# Pull request and main-branch validation for release contracts and package
# materials. Publication capability stays only in npm-release.yml behind the
# npm-production Environment gate.
on:
  pull_request:
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'release/**'
      - 'scripts/validate-docker-context.mjs'
      - 'scripts/validate-prerelease-contract.mjs'
      - 'scripts/validate-prerelease.sh'
      - 'scripts/test-prerelease-contract.sh'
      - 'scripts/test-prerelease-manifest.sh'
      - 'scripts/smoke-npm-packages.mjs'
      - 'scripts/check-npm-production-release.mjs'
      - 'scripts/verify-published-npm-release.mjs'
      - 'scripts/validate-release-consistency.mjs'
      - 'scripts/validate-release-consistency.test.mjs'
      - '.github/workflows/release-validation.yml'
      - '.github/workflows/npm-*.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'release/**'
      - 'scripts/validate-docker-context.mjs'
      - 'scripts/validate-prerelease-contract.mjs'
      - 'scripts/validate-prerelease.sh'
      - 'scripts/test-prerelease-contract.sh'
      - 'scripts/test-prerelease-manifest.sh'
      - 'scripts/smoke-npm-packages.mjs'
      - 'scripts/check-npm-production-release.mjs'
      - 'scripts/verify-published-npm-release.mjs'
      - 'scripts/validate-release-consistency.mjs'
      - 'scripts/validate-release-consistency.test.mjs'
      - '.github/workflows/release-validation.yml'
      - '.github/workflows/npm-*.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove release capability boundaries
        run: ./scripts/test-prerelease-contract.sh

      - name: Validate npm production release contract
        run: pnpm test:npm-production-release

      - name: Validate clean release inputs and real pack reports
        env:
          CI: true
        run: ./scripts/validate-prerelease.sh

      - name: Clean-install and import packed public packages
        run: pnpm test:npm-packages

      - name: Validate package, Cargo, and CLI runtime versions
        run: pnpm test:release-consistency
