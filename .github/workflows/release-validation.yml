name: Prerelease Validation Only

# P1-B1 is evidence generation only. This workflow has no publication
# credentials, write permission, tag trigger, publish step, registry push, or
# GitHub Release operation. A later owner/legal-approved PR must add those.
on:
  pull_request:
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'release/**'
      - 'scripts/audit-release.sh'
      - 'scripts/release-audit.mjs'
      - 'scripts/validate-docker-context.mjs'
      - 'scripts/validate-prerelease-contract.mjs'
      - 'scripts/validate-prerelease.sh'
      - 'scripts/test-prerelease-contract.sh'
      - 'scripts/test-prerelease-manifest.sh'
      - 'scripts/smoke-npm-packages.mjs'
      - 'scripts/agent-release*.mjs'
      - 'scripts/prepare-agent-release.mjs'
      - 'scripts/prepare-release-pr.mjs'
      - 'scripts/release-reconciliation*.mjs'
      - 'scripts/verify-agent-release.mjs'
      - 'scripts/test-agent-release-workflows.mjs'
      - '.github/workflows/release-validation.yml'
      - '.github/workflows/npm-*.yml'
      - 'docs/release/AGENT-OPERATED-RELEASE.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'release/**'
      - 'scripts/audit-release.sh'
      - 'scripts/release-audit.mjs'
      - 'scripts/validate-docker-context.mjs'
      - 'scripts/validate-prerelease-contract.mjs'
      - 'scripts/validate-prerelease.sh'
      - 'scripts/test-prerelease-contract.sh'
      - 'scripts/test-prerelease-manifest.sh'
      - 'scripts/smoke-npm-packages.mjs'
      - 'scripts/agent-release*.mjs'
      - 'scripts/prepare-agent-release.mjs'
      - 'scripts/prepare-release-pr.mjs'
      - 'scripts/release-reconciliation*.mjs'
      - 'scripts/verify-agent-release.mjs'
      - 'scripts/test-agent-release-workflows.mjs'
      - '.github/workflows/release-validation.yml'
      - '.github/workflows/npm-*.yml'
      - 'docs/release/AGENT-OPERATED-RELEASE.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove validation-only contract
        run: ./scripts/test-prerelease-contract.sh

      - name: Prove active Agent release architecture
        run: |
          pnpm test:release-plan
          pnpm test:release-workflows

      - name: Validate clean release inputs and real pack reports
        env:
          CI: true
        run: ./scripts/validate-prerelease.sh

      - name: Clean-install and import packed public packages
        run: pnpm test:npm-packages
