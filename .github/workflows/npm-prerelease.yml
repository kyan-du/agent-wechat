name: Legacy tagged prerelease validation (inert)

# PR #49's exact-tag validator remains available as read-only evidence while the
# explicit Agent-operated workflow is reviewed. Tag push and all publication
# capabilities are retired; .github/workflows/npm-agent-release.yml is the only
# proposed future deployment architecture.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z-next.N tag to validate
        required: true
        type: string
      dry_run:
        description: Validate and pack only; never publish, tag, or create a Release
        required: true
        default: true
        type: boolean

concurrency:
  group: npm-prerelease-legacy-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: none

env:
  RELEASE_TAG: ${{ inputs.tag }}
  TRUSTED_NPM_VERSION: 11.5.1

jobs:
  validate:
    name: Validate exact tagged npm next prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Pin Trusted Publishing-compatible npm client
        run: |
          npm install --global "npm@$TRUSTED_NPM_VERSION"
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "$TRUSTED_NPM_VERSION"
      - name: Authorize immutable tagged source on main
        run: |
          set -euo pipefail
          test "${{ inputs.dry_run }}" = true
          git fetch origin main --no-tags
          version="${RELEASE_TAG#v}"
          test "v$version" = "$RELEASE_TAG"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$'
          release_sha="$(git rev-parse HEAD^{commit})"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$release_sha"
          git merge-base --is-ancestor "$release_sha" origin/main
          node scripts/verify-npm-prerelease.mjs "$version"
      - name: Install, test, build, audit, and clean-install packed artifacts
        env:
          CI: true
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm --filter @kyan-du/agent-wechat-shared test
          pnpm --filter @kyan-du/agent-wechat-cli test
          pnpm --filter @kyan-du/agent-wechat-openclaw test
          pnpm --filter @kyan-du/agent-wechat-wechaty-puppet test
          pnpm build
          pnpm test:npm-packages
          node scripts/test-npm-release-authorization.mjs
          node scripts/validate-release-boundary.mjs
          node scripts/release-audit.mjs --write
          git diff --exit-code -- docs/release-audit/npm-materials.json
          git diff --exit-code
      - name: Confirm retired publication boundary
        run: echo 'Legacy tag validation has no authorization fetch, registry write, tag write, OIDC grant, or GitHub Release operation.'
