name: Publish tagged npm prerelease

# A signed/authorized vX.Y.Z-next.N tag is the release intent. The job verifies
# that the tag, all public package manifests, and origin/main identify the same
# immutable release before any registry write.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-next.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z-next.N tag to validate
        required: true
        type: string
      dry_run:
        description: Validate and pack only; never publish or create a Release
        required: true
        default: true
        type: boolean

concurrency:
  group: npm-prerelease-${{ github.ref_name }}-${{ inputs.tag || '' }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ always() && github.ref_name || inputs.tag }}

jobs:
  publish:
    name: Validate and publish exact npm next prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: npm-prerelease
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Authorize immutable tag on main
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          version="${RELEASE_TAG#v}"
          test "v$version" = "$RELEASE_TAG"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$'
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/verify-npm-prerelease.mjs "$version"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate, test, build, audit, and clean-install packed artifacts
        env:
          CI: true
        run: |
          pnpm typecheck
          pnpm --filter @kyan-du/agent-wechat-shared test
          pnpm --filter @kyan-du/agent-wechat-cli test
          pnpm --filter @kyan-du/agent-wechat-openclaw test
          pnpm --filter @kyan-du/agent-wechat-wechaty-puppet test
          pnpm build
          pnpm test:npm-packages
          node scripts/validate-release-boundary.mjs
          node scripts/release-audit.mjs --write
          git diff --exit-code -- docs/release-audit/npm-materials.json
          git diff --exit-code

      - name: Refuse an already-published version
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for package in \
            @kyan-du/agent-wechat-cli \
            @kyan-du/agent-wechat-openclaw \
            @kyan-du/agent-wechat-wechaty-puppet
          do
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "Refusing duplicate publication: $package@$version" >&2
              exit 1
            fi
          done

      - name: Publish three exact packages to next with provenance
        if: ${{ github.event_name == 'push' }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          npm publish ./packages/cli --tag next --access public --provenance
          npm publish ./packages/openclaw-extension --tag next --access public --provenance
          npm publish ./packages/wechaty-puppet --tag next --access public --provenance

      - name: Create immutable GitHub prerelease
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --prerelease --generate-notes --title "$RELEASE_TAG"
